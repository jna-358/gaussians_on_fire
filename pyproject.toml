[project]
name = "gsof"
version = "0.1.0"
description = "Gaussians on Fire (GSoF): high-frequency reconstruction of flames"
requires-python = "==3.10.18"
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "numpy==2.2.6",
    "opencv-python-headless==4.13.0.90",
    "pillow==12.1.0",
    "plyfile==1.1.3",
    "tqdm==4.67.1",
    "diff-gaussian-rasterization",
    "fused-ssim",
]

[tool.uv]
package = false
default-groups = ["preprocess"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
diff-gaussian-rasterization = { path = "submodules/diff-gaussian-rasterization" }
fused-ssim = { path = "submodules/fused-ssim" }
memfof = { git = "https://github.com/msu-video-group/memfof", rev = "050fff8aee5fe5aadd73e4cee697d92caa3abb15" }

# Build the CUDA extensions against the installed torch.
[tool.uv.extra-build-dependencies]
diff-gaussian-rasterization = [{ requirement = "torch", match-runtime = true }, "ninja"]
fused-ssim = [{ requirement = "torch", match-runtime = true }, "ninja"]

# CUDA architectures: 7.5 T4, 8.0 A100, 8.6 A6000/RTX30xx, 8.9 L4/RTX40xx, 9.0 H100 (+PTX for newer).
[tool.uv.extra-build-variables]
diff-gaussian-rasterization = { TORCH_CUDA_ARCH_LIST = "7.5;8.0;8.6;8.9;9.0+PTX" }
fused-ssim = { TORCH_CUDA_ARCH_LIST = "7.5;8.0;8.6;8.9;9.0+PTX" }

# Static metadata for the local CUDA extensions.
[[tool.uv.dependency-metadata]]
name = "diff-gaussian-rasterization"
version = "0.0.0"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "fused-ssim"
version = "0.0.0"
requires-dist = []

[dependency-groups]
preprocess = [
    "memfof",
    "pycolmap-cuda==3.13.0.dev2",
]
